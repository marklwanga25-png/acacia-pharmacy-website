<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery | Acacia Pharmacy</title>
    <meta name="description" content="Explore our modern facilities, dispensaries, consultation areas, and compounding labs.">
    
    <style>
        /* ==========================================================================
           1. CORE DESIGN TOKENS (ICE-GREEN PALETTE)
           ========================================================================== */
        :root {
            --primary-ice: #5fc3a0;
            --primary-dark: #329b78;
            --primary-gradient: linear-gradient(135deg, #e1f5ed 0%, #aae3cd 100%);
            --bg-light: #f4fbf8;
            --text-main: #17251f;
            --text-muted: #52605a;
            --white: #ffffff;
            --card-border: #e2eee9;
            --shadow-subtle: 0 10px 30px rgba(40, 100, 80, 0.06);
            --radius-main: 16px;
            --transition-smooth: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* Base Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background-color: var(--white);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            width: min(1200px, 92%);
            margin: 0 auto;
        }

        /* ==========================================================================
           2. HEADER & NAVIGATION
           ========================================================================== */
        header {
            background-color: var(--white);
            border-bottom: 1px solid rgba(95, 195, 160, 0.15);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 80px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Hand-crafted vector leaf emblem directly inside the stylesheet */
        .logo-icon {
            width: 38px;
            height: 38px;
            background-color: transparent;
            background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%23329b78' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 3.5 1 9.8a7 7 0 0 1-9 8.2z'/%3E%3Cpath d='M9 12c2.5 1 3.5 2.5 4.5 6'/%3E%3C/svg%3E");
            background-size: contain;
            background-repeat: no-repeat;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-links a {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .nav-links a:hover {
            color: var(--primary-dark);
        }

        .btn-contact {
            background-color: var(--primary-ice);
            color: var(--white) !important;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
        }

        .btn-contact:hover {
            background-color: var(--primary-dark);
        }

        .mobile-menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--primary-dark);
        }

        /* ==========================================================================
           3. HERO PROFILE ACCENT
           ========================================================================== */
        .hero-banner {
            background: var(--primary-gradient);
            padding: 60px 0;
            text-align: center;
            margin-bottom: 50px;
        }

        .hero-banner h1 {
            font-size: clamp(32px, 4vw, 44px);
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .hero-banner p {
            font-size: clamp(15px, 2vw, 18px);
            color: var(--text-muted);
            font-weight: 400;
        }

        /* ==========================================================================
           4. GALLERY MEDIA GRID (UPDATED FOR 8 ITEMS)
           ========================================================================== */
        .gallery-grid {
            display: grid;
            /* Using auto-fill grid rows to perfectly distribute 8 items seamlessly */
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
            margin-bottom: 80px;
        }

        .gallery-card {
            background-color: var(--white);
            border-radius: var(--radius-main);
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-smooth);
        }

        .gallery-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(40, 100, 80, 0.12);
            border-color: var(--primary-ice);
        }

        .card-image-wrapper {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background-color: var(--bg-light);
        }

        .card-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .gallery-card:hover .card-image-wrapper img {
            transform: scale(1.04);
        }

        .card-title {
            padding: 18px 15px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            border-top: 1px solid var(--card-border);
            background-color: var(--white);
        }

        /* ==========================================================================
           5. SYSTEM FOOTER
           ========================================================================== */
        footer {
            background-color: var(--bg-light);
            border-top: 1px solid var(--card-border);
            padding: 40px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-links {
            display: flex;
            gap: 40px;
        }

        .footer-links a:hover {
            color: var(--primary-dark);
        }

        /* ==========================================================================
           6. RESPONSIVE MEDIA BREAKPOINTS
           ========================================================================== */
        @media (max-width: 992px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .mobile-menu-toggle {
                display: block;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .hero-banner {
                padding: 45px 0;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }

            .footer-links {
                justify-content: center;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- STICKY SITE NAVIGATION -->
    <header>
        <div class="container navbar">
            <div class="logo">
                <div class="logo-icon"></div>
            </div>
            <nav class="nav-links">
                <a href="#home">Home</a>
                <a href="#about">About Us</a>
                <a href="#services">Services</a>
                <a href="#branches">Branches</a>
                <a href="#contact" class="btn-contact">Contact Us</a>
            </nav>
            <button class="mobile-menu-toggle" aria-label="Toggle Menu">☰</button>
        </div>
    </header>

    <!-- BANNER CONTEXT AREA -->
    <section class="hero-banner">
        <div class="container">
            <h1>Our Gallery</h1>
            <p>Explore Our Modern Facilities and Services</p>
        </div>
    </section>

    <!-- EIGHT CARD INTERACTIVE PHOTO CONTAINER -->
    <main class="container">
        <div class="gallery-grid">
            
            <!-- Card 1: Dispensary -->
            <div class="gallery-card">
                <div class="card-image-wrapper">
                    <img src="https://unsplash.com" alt="Main Dispensary Counter Area">
                </div>
                <div class="card-title">Main Dispensary</div>
            </div>

            <!-- Card 2: Showcase -->
            <div class="gallery-card">
                <div class="card-image-wrapper">
                    <img src="https://unsplash.com" alt="Product shelves display units">
                </div>
                <div class="card-title">Product Showcase</div>
