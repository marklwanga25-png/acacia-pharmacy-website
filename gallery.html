<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | Acacia Pharmacy</title>

    <meta name="description"
          content="Explore Acacia Pharmacy branches, facilities, healthcare services and pharmacy environment.">

    <style>

        /* =====================================
           ACACIA PHARMACY
           GALLERY PAGE
           ICE PLANT GREEN THEME
        ====================================== */

        :root {
            --ice-green: #5fc3a0;
            --ice-green-dark: #329b78;
            --ice-green-light: #e9f8f2;
            --ice-green-pale: #f4fbf8;
            --dark: #17251f;
            --text: #52605a;
            --white: #ffffff;
            --border: #e2eee9;
            --shadow: 0 10px 35px rgba(40, 100, 80, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--dark);
            background: white;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            width: 100%;
            display: block;
        }

        .container {
            width: min(1120px, 92%);
            margin: auto;
        }


        /* =====================================
           TOP BAR
        ====================================== */

        .top-bar {
            background: var(--ice-green-dark);
            color: white;
            padding: 8px 0;
            font-size: 13px;
        }

        .top-content {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }


        /* =====================================
           NAVIGATION
        ====================================== */

        header {
            background: rgba(255,255,255,0.97);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            border-radius: 5px;
            background: var(--ice-green);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: bold;
        }

        .logo-text h1 {
            font-size: 22px;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .logo-text span {
            font-size: 11px;
            letter-spacing: 3px;
            color: var(--text);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .nav-links a {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--ice-green-dark);
        }

        .whatsapp-btn {
            background: var(--ice-green);
            color: white !important;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold !important;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .whatsapp-btn:hover {
            background: var(--ice-green-dark) !important;
        }

        .menu-btn {
            display: none;
            border: none;
            background: none;
            font-size: 28px;
            cursor: pointer;
        }


        /* =====================================
           PAGE HERO
        ====================================== */

        .page-hero {
            background:
                radial-gradient(
                    circle at 85% 20%,
                    #dff6ec 0,
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #f4fbf8,
                    #ffffff
                );

            padding: 80px 0;
            text-align: center;
        }

        .page-hero span {
            color: var(--ice-green-dark);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 13px;
        }

        .page-hero h2 {
            font-size: clamp(40px, 6vw, 58px);
            margin: 10px 0;
        }

        .page-hero p {
            color: var(--text);
            max-width: 650px;
            margin: auto;
            font-size: 17px;
        }


        /* =====================================
           GALLERY INTRO
        ====================================== */

        .gallery-intro {
            padding: 65px 0 35px;
            text-align: center;
        }

        .gallery-intro h2 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .gallery-intro p {
            color: var(--text);
            max-width: 650px;
            margin: auto;
        }


        /* =====================================
           GALLERY
        ====================================== */

        .gallery-section {
            padding: 20px 0 85px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 18px;
            background: var(--ice-green-light);
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(40,100,80,0.06);
        }

        .gallery-item img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.07);
        }

        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 35px 18px 18px;

            background:
                linear-gradient(
                    transparent,
                    rgba(0,0,0,0.75)
                );

            color: white;
        }

        .gallery-caption h3 {
            font-size: 17px;
            margin-bottom: 3px;
        }

        .gallery-caption p {
            font-size: 12px;
            opacity: 0.9;
        }


        /* =====================================
           FEATURED IMAGE
        ====================================== */

        .featured-gallery {
            margin-bottom: 20px;
        }

        .featured-gallery .gallery-item img {
            height: 450px;
        }


        /* =====================================
           GALLERY CATEGORIES (FIXED & COMPLETED)
        ====================================== */

        .category-section {
            background: var(--ice-green-pale);
            padding: 75px 0;
        }

        .section-heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-heading span {
            color: var(--ice-green-dark);
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .section-heading h2 {
            font-size: 36px;
            margin: 8px 0;
        }

        .section-heading p {
            color: var(--text);
            max-width: 600px;
            margin: auto;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .category-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: var(--ice-green);
        }

        .category-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: var(--dark);
        }

        .category-card p {
            font-size: 14px;
            color: var(--text);
        }

        /* =====================================
           RESPONSIVE MOBILE STYLES
        ====================================== */
        @media (max-width: 992px) {
            .gallery-grid, .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .menu-btn { display: block; }
            .top-content { flex-direction: column; text-align: center; gap: 5px; }
            .gallery-grid, .category-grid { grid-template-columns: 1fr; }
            .featured-gallery .gallery-item img { height: 300px; }
        }

    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="container top-content">
            <div>📍 Quality healthcare close to you</div>
            <div>📞 Emergency Contact: +256 000 000000</div>
        </div>
    </div>

    <!-- HEADER / NAVIGATION -->
    <header>
        <div class="container navbar">
            <div class="logo">
                <div class="logo-icon">+</div>
                <div class="logo-text">
                    <h1>Acacia Pharmacy</h1>
                    <span>HEALTH & WELLNESS</span>
